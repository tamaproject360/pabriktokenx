version: '3.8'

# Development version with hot-reload
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pabriktokenx-backend-dev
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      # Mount entire source for hot-reload (development only)
      - .:/app
      - /app/bin  # Exclude bin directory
    environment:
      - TZ=Asia/Jakarta
      - DEBUG=true
      - MANAGEMENT_PASSWORD=${MANAGEMENT_PASSWORD:-}
      - OAUTH_PUBLIC_BASE_URL=${OAUTH_PUBLIC_BASE_URL:-}
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
    networks:
      - pabriktokenx-network
    command: sh -c "go run ./cmd/server -config /app/config.docker.yaml"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: pabriktokenx-frontend-dev
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Jakarta
      - VITE_API_URL=http://localhost:9999
    networks:
      - pabriktokenx-network
    command: sh -c "npm ci; npm run dev -- --host 0.0.0.0 --port 8686"

networks:
  pabriktokenx-network:
    driver: bridge
